<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kodukord</title>
<meta name="theme-color" content="#2a8c7e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kodukord">

<style>
:root{
  --bg:#f6f4ee; --card:#fff; --ink:#23302e; --muted:#6f7c79; --line:#e6e2d8;
  --teal:#2a8c7e; --teal-soft:#dff1ec; --sun:#f4b942; --sun-soft:#fdf1d6;
  --rose:#e07a5f; --rose-soft:#fbe6df; --sky:#5b8fd6; --sky-soft:#e3edfa;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--teal);display:grid;place-items:center;font-size:22px;flex:none}
.htxt{flex:1;min-width:0}
.htxt h1{font-size:20px;margin:0;letter-spacing:.2px}
.htxt div{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:40px;min-width:40px;padding:0 10px;font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hero{background:linear-gradient(135deg,#2a8c7e,#3aa695);color:#fff}
.hero .big{font-size:26px;font-weight:700;margin:2px 0 6px}
.hero .sub{opacity:.9;font-size:14px}
.bar{height:10px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:#fff;border-radius:10px;transition:width .3s}
.focus{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:5px 10px;border-radius:20px;font-size:14px;margin-top:10px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{text-transform:none;letter-spacing:0;font-weight:500}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.task:first-child{border-top:0}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid #c9cfcd;flex:none;display:grid;place-items:center;transition:all .15s}
.task.done .chk{background:var(--teal);border-color:var(--teal)}
.task.done .chk:after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.tbody{flex:1;min-width:0}
.tname{font-size:16px}
.task.done .tname{color:var(--muted);text-decoration:line-through;text-decoration-color:#b8c2bf}
.tmeta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:11.5px;padding:2px 7px;border-radius:10px;background:#f0eee8;color:#59625f;white-space:nowrap}
.pill.fr{background:var(--sky-soft);color:#2f5f9e}
.pill.ben{background:var(--sun-soft);color:#8a6410}
.pill.late{background:var(--rose-soft);color:#a24a33}
.mins{font-size:12.5px;color:var(--muted);flex:none}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.yay{text-align:center;padding:20px 10px}
.yay .e{font-size:44px}
.yay b{display:block;font-size:18px;margin:6px 0 2px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{max-width:720px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--teal);font-weight:700}
nav button.on span{filter:none;opacity:1}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.room{background:var(--card);border-radius:var(--r);padding:14px;border:0;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:6px;min-height:104px}
.room .em{font-size:28px}
.room b{font-size:15px}
.room small{font-size:12.5px;color:var(--muted)}
.room small.due{color:#a24a33;font-weight:600}
.back{border:0;background:none;color:var(--teal);font-weight:600;padding:6px 0;margin-bottom:6px}
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rhead .em{font-size:38px}
.rhead h3{margin:0;font-size:22px}
.x{border:0;background:none;color:#a5aeab;font-size:18px;padding:6px;flex:none}
.day{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.day:first-child{border-top:0}
.day.today{background:var(--teal-soft)}
.day .dn{width:46px;font-weight:700;flex:none}
.day .dz{flex:1}
.day .dz div{font-size:13px;color:var(--muted);margin-top:2px}
.tip{display:flex;gap:12px}
.tip .e{font-size:26px;flex:none}
.tip b{display:block;margin-bottom:3px}
.tip p{margin:0;color:#4b5755;font-size:14.5px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{font-size:12px;min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;background:var(--teal);color:#fff}
.btn.sec{background:#eeebe3;color:var(--ink)}
.btn.warn{background:var(--rose-soft);color:#a24a33}
.seg{display:flex;background:#eeebe3;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:10px 4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%);background:#23302e;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (min-width:700px){ .hero .big{font-size:30px} }
</style>
</head>

/* ---------- State ---------- */
const KEY="kodukord-v1";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x};
const dow=d=>((d.getDay()+6)%7)+1;
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);

let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||typeof S!=="object")S={};
  S.start=S.start||iso(new Date());
  S.lang=S.lang||((navigator.language||"").toLowerCase().startsWith("et")?"et":"en");
  S.done=S.done||{}; S.hidden=S.hidden||[]; S.custom=S.custom||[];
  if(S.helpers===undefined)S.helpers=true;
  save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function parseSched(s){
  if(s==="d")return{t:"d",iv:1,gr:0};
  if(s[0]==="w")return{t:"w",dow:+s.slice(1),iv:7,gr:3};
  const p=s.slice(1).split(".").map(Number);
  if(s[0]==="b")return{t:"b",par:p[0],dow:p[1],iv:14,gr:6};
  if(s[0]==="m")return{t:"m",wk:p[0],dow:p[1],iv:30,gr:14};
  if(s[0]==="q")return{t:"q",mm:p[0],wk:p[1],dow:p[2],iv:91,gr:30};
}
function tasks(){
  const all=BASE.map(a=>({id:a[0],room:a[1],s:a[2],min:a[3],en:a[4],et:a[5],help:a[6]||null}))
    .concat(S.custom.map(c=>({...c,custom:true})));
  all.forEach(t=>t.sp=parseSched(t.s));
  return all;
}
function planned(t,d){
  const p=t.sp;
  if(p.t==="d")return true;
  if(dow(d)!==p.dow)return false;
  if(p.t==="w")return true;
  if(p.t==="b"){const wk=Math.floor(Math.round((d-new Date(2024,0,1))/864e5)/7);return wk%2===p.par}
  const wom=Math.ceil(d.getDate()/7);
  if(p.t==="m")return wom===p.wk;
  if(p.t==="q")return d.getMonth()%3===p.mm&&wom===p.wk;
}
function prevOcc(t,d){for(let i=0;i<120;i++){const x=addD(d,-i);if(planned(t,x))return iso(x)}return null}
function nextOcc(t,d){for(let i=0;i<120;i++){const x=addD(d,i);if(planned(t,x))return iso(x)}return null}
function last(t){return S.done[t.id]&&S.done[t.id].l||null}
function doneFor(t,occ){const l=last(t);return !!l&&l>=iso(addD(parse(occ),-t.sp.gr))}
function toggle(t,isDone){
  const rec=S.done[t.id]||{};
  if(isDone)S.done[t.id]={l:rec.p||null,p:null};
  else S.done[t.id]={l:iso(new Date()),p:rec.l||null};
  save();push({["done/"+t.id]:S.done[t.id]});
}

/* ---------- Today model ---------- */
function todayModel(){
  const now=new Date(),td=iso(now),yd=addD(now,-1);
  const daily=[],focus=[],catchup=[];
  for(const t of tasks()){
    if(S.hidden.includes(t.id))continue;
    if(t.sp.t==="d"){daily.push({t,done:last(t)===td});continue}
    if(planned(t,now)){focus.push({t,done:doneFor(t,td)});continue}
    const p=prevOcc(t,yd);
    if(p&&p>=S.start&&daysBetween(p,td)<=(t.sp.iv>14?13:6)){
      const dn=doneFor(t,p);
      if(!dn)catchup.push({t,done:false,occ:p});
      else if(last(t)===td)catchup.push({t,done:true,occ:p});
    }
  }
  catchup.sort((a,b)=>a.occ<b.occ?1:-1);
  return{daily,focus,catchup};
}

/* ---------- Render helpers ---------- */
const L=()=>T[S.lang];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=t=>esc(t[S.lang]||t.en);
function ago(t){
  const l=last(t);if(!l)return L().never;
  const n=daysBetween(l,iso(new Date()));
  return L().lastDone+" "+(n<=0?L().todayW:n===1?L().yesterday:n+" "+L().daysAgo);
}
function schedLabel(t){
  const p=t.sp,lg=S.lang,l=L();
  if(p.t==="d")return l.daily;
  if(p.t==="w")return DAYS_LONG[lg][p.dow].replace(/^./,c=>c.toUpperCase());
  if(p.t==="b")return l.biweekly+", "+DAY_ONE[lg][p.dow];
  if(p.t==="m")return lg==="et"?`Kuu ${p.wk}. ${DAY_ONE.et[p.dow]}`:`${l.nth[p.wk]} ${DAY_ONE.en[p.dow]} of the month`;
  if(p.t==="q")return lg==="et"?`${MONTHS_Q.et[p.mm]}: ${p.wk}. ${DAY_ONE.et[p.dow]}`:`${MONTHS_Q.en[p.mm]}: ${l.nth[p.wk]} ${DAY_ONE.en[p.dow]}`;
}
function helpPill(t){
  if(!S.helpers||!t.help)return"";
  if(t.help==="frank")return`<span class="pill fr">💦 ${L().frankHelp}</span>`;
  if(t.help==="ben")return`<span class="pill ben">⭐ ${L().benHelp}</span>`;
  return`<span class="pill ben">⭐💦 ${L().bothHelp}</span>`;
}
function row(item,ctx){
  const t=item.t,r=R[t.room];
  let meta=`<span>${r.em} ${esc(r[S.lang])}</span>`;
  if(ctx==="catch"){const n=daysBetween(item.occ,iso(new Date()));meta+=`<span class="pill late">${DAY_ONE[S.lang][dow(parse(item.occ))]}${n>6?" · "+n+" "+L().daysAgo:""}</span>`}
  if(ctx==="room")meta=`<span>${esc(schedLabel(t))}</span><span>· ${ago(t)}</span>`;
  meta+=helpPill(t);
  const extra=ctx==="room"?`<button class="x" data-hide="${t.id}" title="${t.custom?L().del:L().hide}">${t.custom?"🗑":"✕"}</button>`:"";
  return`<div class="task ${item.done?"done":""}" data-id="${t.id}" data-done="${item.done?1:0}" role="button" tabindex="0">
    <span class="chk"></span><div class="tbody"><div class="tname">${nm(t)}</div><div class="tmeta">${meta}</div></div>
    ${extra}</div>`;
}

/* ---------- Views ---------- */
let catchOpen=false,view="today",openRoom=null,resetArm=false;
function render(){
  document.documentElement.lang=S.lang;
  const l=L(),now=new Date();
  const dateStr=now.toLocaleDateString(S.lang==="et"?"et-EE":"en-GB",{weekday:"long",day:"numeric",month:"long"});
  let h=`<header><div class="logo">🏡</div><div class="htxt"><h1>Kodukord</h1><div>${esc(dateStr.charAt(0).toUpperCase()+dateStr.slice(1))}</div></div>
    <button class="iconbtn" id="lang">${S.lang==="et"?"EN":"ET"}</button><button class="iconbtn" id="gear" aria-label="${l.settings}">⚙︎</button></header>`;
  if(view==="today")h+=vToday();
  else if(view==="rooms")h+=openRoom?vRoom(openRoom):vRooms();
  else if(view==="plan")h+=vPlan();
  else if(view==="tips")h+=vTips();
  else if(view==="settings")h+=vSettings();
  document.getElementById("app").innerHTML=h;
  const tabs=[["today","✅",l.today],["rooms","🚪",l.rooms],["plan","📅",l.plan],["tips","💡",l.tips]];
  document.getElementById("nav").innerHTML=tabs.map(([k,e,n])=>`<button data-tab="${k}" class="${view===k?"on":""}"><span>${e}</span>${n}</button>`).join("");
}
function vToday(){
  const l=L(),m=todayModel(),z=ZONES[dow(new Date())];
  const all=[...m.daily,...m.focus],done=all.filter(x=>x.done).length;
  const pct=all.length?Math.round(done/all.length*100):0;
  let h=`<div class="card hero">
    <div class="big">${pct===100?"🎉 "+l.done:done?l.going:l.start}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="focus">${z.em} ${l.focus}: <b>${esc(z[S.lang])}</b></div></div>`;
  if(pct===100&&!m.catchup.some(x=>!x.done))h+=`<div class="card yay"><div class="e">✨🏡✨</div><b>${l.allDone}</b><span class="note">${l.allDoneSub}</span></div>`;
  h+=`<h2>${z.em} ${l.focus}</h2>`;
  h+=m.focus.length?`<div class="list">${sortDone(m.focus).map(x=>row(x)).join("")}</div>`:`<div class="list"><div class="empty">${l.none}</div></div>`;
  h+=`<h2>☀️ ${l.daily}</h2>`;
  h+=`<div class="list">${sortDone(m.daily).map(x=>row(x)).join("")}</div>`;
  if(m.catchup.length){
    h+=`<h2>🕓 ${l.catchup}</h2><div class="note" style="margin:-4px 4px 8px">${l.catchupHint}</div>`;
    const first=m.catchup.slice(0,4),rest=m.catchup.slice(4);
    h+=`<div class="list">${first.map(x=>row(x,"catch")).join("")}</div>`;
    if(rest.length)h+=`<details${catchOpen?" open":""} id="more"><summary>+ ${rest.length} ${l.more}</summary><div class="list">${rest.map(x=>row(x,"catch")).join("")}</div></details>`;
  }
  return h;
}
const sortDone=a=>a.slice().sort((x,y)=>x.done-y.done);
function roomDue(id){const m=todayModel();return[...m.daily,...m.focus,...m.catchup].filter(x=>x.t.room===id&&!x.done).length}
function vRooms(){
  const l=L();
  return`<div class="note" style="margin:0 4px 12px">${l.home}</div><div class="rooms">${ROOMS.map(r=>{
    const n=roomDue(r.id);
    return`<button class="room" data-room="${r.id}"><span class="em">${r.em}</span><b>${esc(r[S.lang])}</b>
      <small class="${n?"due":""}">${n?n+" "+l.due:"✓ "+l.allok}</small></button>`}).join("")}</div>`;
}
function vRoom(id){
  const l=L(),r=R[id],td=iso(new Date());
  const ts=tasks().filter(t=>t.room===id);
  const vis=ts.filter(t=>!S.hidden.includes(t.id)),hid=ts.filter(t=>S.hidden.includes(t.id));
  const isDone=t=>t.sp.t==="d"?last(t)===td:(!!last(t)&&daysBetween(last(t),td)<t.sp.iv);
  const groups=[["d",l.daily],["w",l.weekly],["b",l.biweekly],["m",l.monthly],["q",l.quarterly]];
  let h=`<button class="back" id="back">‹ ${l.rooms}</button><div class="rhead"><span class="em">${r.em}</span><h3>${esc(r[S.lang])}</h3></div>`;
  for(const[k,name]of groups){
    const g=vis.filter(t=>t.sp.t===k);if(!g.length)continue;
    h+=`<h2>${name}</h2><div class="list">${g.map(t=>row({t,done:isDone(t)},"room")).join("")}</div>`;
  }
  if(hid.length)h+=`<details><summary>${l.hidden} (${hid.length})</summary><div class="list">${hid.map(t=>`<div class="task"><div class="tbody"><div class="tname" style="color:var(--muted)">${nm(t)}</div></div><button class="btn sec" data-restore="${t.id}">${l.restore}</button></div>`).join("")}</div></details>`;
  const dopt=[1,2,3,4,5,6,7].map(i=>`<option value="${i}">${DAY_ONE[S.lang][i]}</option>`).join("");
  h+=`<h2>${l.addTask}</h2><div class="card"><form id="addf">
    <input type="text" id="an" placeholder="${l.taskName}" maxlength="80" required>
    <div><label class="f">${l.howOften}</label><select id="af">
      <option value="d">${l.daily}</option><option value="w" selected>${l.weekly}</option><option value="b">${l.biweekly}</option><option value="m">${l.monthly}</option></select></div>
    <div class="row" id="adw"><div><label class="f">${l.day}</label><select id="ad">${dopt}</select></div>
      <div id="awk" style="display:none"><label class="f">${l.week}</label><select id="aw"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div>
    <button class="btn" style="width:100%;margin-top:12px">${l.add}</button></form></div>`;
  return h;
}
function vPlan(){
  const l=L(),now=new Date(),td=dow(now),all=tasks().filter(t=>!S.hidden.includes(t.id));
  const mon=addD(now,1-td);
  let h=`<h2 style="margin-top:4px">${l.weekPlan}</h2><div class="note" style="margin:-4px 4px 8px">${l.weekPlanSub}</div><div class="list">`;
  for(let i=1;i<=7;i++){
    const d=addD(mon,i-1),z=ZONES[i];
    const extra=all.filter(t=>t.sp.t!=="d"&&planned(t,d));
    h+=`<div class="day ${i===td?"today":""}"><div class="dn">${DAYS[S.lang][i]} ${d.getDate()}</div><div class="dz"><b>${z.em} ${esc(z[S.lang])}</b>
      ${extra.some(t=>t.sp.t==="m"||t.sp.t==="q")?"<div>+ "+extra.filter(t=>t.sp.t==="m"||t.sp.t==="q").map(nm).join(", ")+"</div>":""}</div></div>`;
  }
  h+=`</div>`;
  // month extras
  const y=now.getFullYear(),mo=now.getMonth(),days=new Date(y,mo+1,0).getDate(),items=[];
  for(let dd=1;dd<=days;dd++){const d=new Date(y,mo,dd);for(const t of all)if((t.sp.t==="m"||t.sp.t==="q")&&planned(t,d))items.push({t,d})}
  h+=`<h2>${l.thisMonth}</h2><div class="list">${items.map(({t,d})=>{
    const isd=doneFor(t,iso(d)),r=R[t.room];
    return`<div class="task ${isd?"done":""}" data-id="${t.id}" data-done="${isd?1:0}" role="button" tabindex="0"><span class="chk"></span><div class="tbody"><div class="tname">${nm(t)}</div>
      <div class="tmeta"><span>${DAYS[S.lang][dow(d)]} ${d.getDate()}.${d.getMonth()+1}</span><span>· ${r.em} ${esc(r[S.lang])}</span>${helpPill(t)}</div></div></div>`}).join("")}</div>`;
  return h;
}
function vTips(){
  const et=S.lang==="et";
  return TIPS.map(t=>`<div class="card tip"><span class="e">${t[0]}</span><div><b>${et?t[2]:t[1]}</b><p>${et?t[4]:t[3]}</p></div></div>`).join("");
}
function vSettings(){
  const l=L();
  return`<button class="back" id="back">‹ ${l.today}</button><h2 style="margin-top:4px">${l.settings}</h2>
  <div class="card"><label class="f" style="margin-top:0">${l.language}</label>

  <h2>${l.backup}</h2><div class="card"><div class="note" style="margin:0 0 10px">${l.backupHint}</div>

    <button class="btn sec" id="load" style="width:100%;margin-top:8px">${l.import}</button></div>
  <div class="card"><button class="btn warn" id="reset" style="width:100%">${resetArm?l.resetConfirm:l.reset}</button></div>`;
}

/* ---------- Events ---------- */
let toastT;
function toast(s){const e=document.getElementById("toast");e.textContent=s;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),1600)}
function findTask(id){return tasks().find(t=>t.id===id)}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-hide],[data-restore],[data-id],[data-tab],[data-room],[data-setlang],[data-help],#lang,#gear,#back,#copy,#load,#reset,#famnew,#famjoin,#famleave");
  if(!el)return;
  if(el.dataset.hide){
    const id=el.dataset.hide,t=findTask(id);
    if(t&&t.custom){S.custom=S.custom.filter(c=>c.id!==id);delete S.done[id];push({custom:S.custom,["done/"+id]:null})}
    else if(!S.hidden.includes(id)){S.hidden.push(id);push({hidden:S.hidden})}
    save();render();return;
  }
  if(el.dataset.restore){S.hidden=S.hidden.filter(x=>x!==el.dataset.restore);save();push({hidden:S.hidden});render();return}
  if(el.dataset.id){const t=findTask(el.dataset.id);if(t){toggle(t,el.dataset.done==="1");if(navigator.vibrate&&el.dataset.done!=="1")try{navigator.vibrate(12)}catch(_){};render()}return}
  if(el.dataset.tab){view=el.dataset.tab;openRoom=null;resetArm=false;render();scrollTo(0,0);return}
  if(el.dataset.room){openRoom=el.dataset.room;render();scrollTo(0,0);return}
  if(el.dataset.setlang){S.lang=el.dataset.setlang;save();render();return}
  if(el.dataset.help){S.helpers=el.dataset.help==="1";save();render();return}
  switch(el.id){
    case"lang":S.lang=S.lang==="et"?"en":"et";save();render();break;
    case"gear":view="settings";resetArm=false;render();scrollTo(0,0);break;
    case"back":if(view==="settings")view="today";openRoom=null;render();scrollTo(0,0);break;
    case"copy":{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      const ta=document.getElementById("imp");ta.value=code;
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast(L().copied),()=>{ta.select();toast(L().copied)});break}
    case"load":try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("imp").value.trim()))));
      if(!o||typeof o!=="object"||!o.done)throw 0;const fam=S.family;S=o;S.family=fam;load();pushAll();toast(L().loaded);render()}catch(_){toast(L().bad)}break;
    case"famnew":{const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";const r=crypto.getRandomValues(new Uint8Array(8));for(const x of r)c+=a[x%a.length];
      startSync(c.slice(0,4)+"-"+c.slice(4),true);break}
    case"famjoin":{const c=(document.getElementById("famcode").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(c.length!==8){toast(L().badCode);break}startSync(c.slice(0,4)+"-"+c.slice(4),false);break}
    case"famleave":stopSync();S.family=null;save();render();break;
    case"reset":if(!resetArm){resetArm=true;render()}else{const lg=S.lang;stopSync();try{localStorage.removeItem(KEY)}catch(_){};load();S.lang=lg;save();resetArm=false;view="today";render()}break;
  }
});
document.addEventListener("toggle",e=>{if(e.target.id==="more")catchOpen=e.target.open},true);
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".task[data-id]")){e.preventDefault();e.target.click()}});
document.addEventListener("change",e=>{if(e.target.id==="af"){const v=e.target.value;document.getElementById("adw").style.display=v==="d"?"none":"flex";document.getElementById("awk").style.display=v==="m"?"block":"none"}});
document.addEventListener("submit",e=>{
  if(e.target.id!=="addf")return;e.preventDefault();
  const name=document.getElementById("an").value.trim();if(!name)return;
  const f=document.getElementById("af").value,d=document.getElementById("ad").value,w=document.getElementById("aw").value;
  const s=f==="d"?"d":f==="w"?"w"+d:f==="b"?"b0."+d:"m"+w+"."+d;
  S.custom.push({id:"c-"+Date.now().toString(36),room:openRoom,s,min:0,en:name,et:name,help:null});
  save();push({custom:S.custom});toast(L().added);render();
});
/* re-render when the day changes or the app comes back to the foreground */
let lastDay=iso(new Date());
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&iso(new Date())!==lastDay){lastDay=iso(new Date());render()}});
setInterval(()=>{if(iso(new Date())!==lastDay){lastDay=iso(new Date());render()}},60000);

/* ---------- Family sync (Firebase Realtime Database) ---------- */
const FB=window.KODUKORD_FIREBASE||null;let fbDb=null,famRef=null,conn="connecting",fbLoading=null;
const toArr=v=>Array.isArray(v)?v.filter(x=>x!=null):v&&typeof v==="object"?Object.values(v):[];
function loadScript(src){return new Promise((ok,no)=>{const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
function fbInit(){
  if(fbDb)return Promise.resolve(fbDb);
  if(!fbLoading){const v="10.12.2",b="https://www.gstatic.com/firebasejs/"+v+"/";
    fbLoading=loadScript(b+"firebase-app-compat.js").then(()=>loadScript(b+"firebase-database-compat.js")).then(()=>{
      firebase.initializeApp(FB);fbDb=firebase.database();
      fbDb.ref(".info/connected").on("value",s=>{conn=s.val()?"online":"offline";if(view==="settings")render()});
      return fbDb});}
  return fbLoading;
}
function shared(){return{start:S.start,done:S.done,hidden:S.hidden,custom:S.custom}}
function push(upd){if(famRef)famRef.update(upd).catch(()=>{})}
function pushAll(){if(famRef)famRef.set(shared()).catch(()=>{})}
let pendingRender=false;
function safeRender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pendingRender=true;return}render()}
document.addEventListener("focusout",()=>{if(pendingRender){pendingRender=false;setTimeout(render,50)}});
function startSync(code,isNew){
  if(!FB)return;
  fbInit().then(db=>{
    stopSync();S.family=code;save();
    famRef=db.ref("families/"+code.replace("-",""));
    let first=true;
    famRef.on("value",snap=>{
      const v=snap.val();
      if(!v){if(first)pushAll();first=false;return}
      if(first&&!isNew){toast(L().joined)}
      first=false;
      S.start=v.start||S.start;S.done=v.done||{};S.hidden=toArr(v.hidden);
      S.custom=toArr(v.custom).filter(c=>c&&c.id&&c.room&&c.s);
      save();safeRender();
    });
    render();
  }).catch(()=>{conn="offline";render()});
}
function stopSync(){if(famRef){famRef.off();famRef=null}}
function syncCard(){
  const l=L();
  if(!FB)return`<div class="note" style="margin:0">${l.syncOff}</div>`;
  if(!S.family)return`<div class="note" style="margin:0 0 10px">${l.syncIntro}</div>
    <button class="btn" id="famnew" style="width:100%">${l.famNew}</button>
    <div class="row" style="margin-top:12px"><input type="text" id="famcode" placeholder="${l.famCodePh}" autocapitalize="characters" autocomplete="off"><button class="btn sec" id="famjoin" style="flex:0 0 auto">${l.famJoin}</button></div>`;
  const dot=conn==="online"?"🟢":conn==="offline"?"🟠":"⚪";
  return`<label class="f" style="margin-top:0">${l.famCode}</label>
    <div style="font-size:28px;font-weight:700;letter-spacing:3px;margin:2px 0 6px">${esc(S.family)}</div>
    <div class="note" style="margin:0 0 8px">${l.famHint}</div>
    <div style="font-size:14px;margin-bottom:12px">${dot} ${conn==="online"?l.online:conn==="offline"?l.offline:l.connecting}</div>
    <button class="btn sec" id="famleave" style="width:100%">${l.famLeave}</button>`;
}

load();render();
if(FB&&S.family)startSync(S.family,false);
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|anthropic/.test(location.hostname)){
  try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(_){}
}
</script>
